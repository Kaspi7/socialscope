    function appendLog(element, text, colorClass = '') {
        const span = document.createElement('span');
        span.className = colorClass;
        span.innerText = text + '\n';
        element.appendChild(span);
        element.scrollTop = element.scrollHeight;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function executeProfiling() {
        const urlInput = document.getElementById('targetUrl').value.trim();
        const outputBox = document.getElementById('output');
        const ticker = document.getElementById('ticker');
        
        if(!urlInput) return alert("TARGET PARAMETER MISSING.");
        
        outputBox.innerHTML = '';

        appendLog(outputBox, `[+] socialscope initializing system exploit routine: ${urlInput}`);

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });
            const data = await response.json();
            
            if(data.error) {
                appendLog(outputBox, `[!] ACQUISITION FAILED: ${data.error}`, 'vuln-alert');
                ticker.style.display = 'none';
                return;

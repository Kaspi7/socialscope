    <style>

        #network-graph { flex: 1; background: #000; border-radius: 4px; }
        .vuln-alert { color: var(--neon-red); font-weight: bold; }
        .warn-alert { color: var(--neon-amber); }
        .success-alert { color: var(--neon-green); }
        .status-ticker { color: var(--neon-amber); margin: 10px 0; font-size: 14px; display: none; font-weight: bold; }

<script>
    let network = null;

    function appendLog(element, text, colorClass = '') {
        const span = document.createElement('span');
        span.className = colorClass;
        span.innerText = text + '\n';
        element.appendChild(span);
        element.scrollTop = element.scrollHeight;
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function executeProfiling() {
        const urlInput = document.getElementById('targetUrl').value.trim();
        const outputBox = document.getElementById('output');
        const ticker = document.getElementById('ticker');
        
        if(!urlInput) return alert("TARGET PARAMETER REQUIRED.");
        
        outputBox.innerHTML = '';
        ticker.style.display = 'block';
        
        appendLog(outputBox, `[+] socialscope querying extended matrix maps for: ${urlInput}`);

        try {
            const response = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });
            const data = await response.json();
            
            if(data.error) {
                appendLog(outputBox, `[!] RECON BLOCKED: ${data.error}`, 'vuln-alert');
                ticker.style.display = 'none';
                return;
            }

            if (data.type === "username") {
                appendLog(outputBox, `[✔] Target Type identified as Username Handle.`, 'success-alert');
                appendLog(outputBox, `\n[⚡] INJECTING MULTI-PLATFORM FOOTPRINT DICTIONARIES...`);
                await sleep(400);
                
                appendLog(outputBox, `\n[📡] RECON ENVELOPE MATCHED CLUSTERS:`);
                if (data.found_accounts.length > 0) {
                    data.found_accounts.forEach(acc => {
                        appendLog(outputBox, `    [MATCH] -> ${acc.platform}: ${acc.url}`, 'success-alert');
                    });
                } else {
                    appendLog(outputBox, `    [ALERT] Zero public indexing traces found on mainstream lists.`, 'vuln-alert');
                }
                
                appendLog(outputBox, `\n[ℹ] DISCORD RECON NOTE:`);
                appendLog(outputBox, `    * ${data.discord_tip}`, 'warn-alert');
                appendLog(outputBox, `\n[☠] SOCIAL SCOPE THREAT SCORE: ${data.risk_profile}`, data.found_accounts.length > 3 ? 'vuln-alert' : 'success-alert');

            } else {
                appendLog(outputBox, `[✔] Host Mapping Resolved -> ${data.ip_address}`, 'success-alert');
                appendLog(outputBox, `\n[📡] TARGET AREA TELEMETRY: ${data.geo.city}, ${data.geo.country} [${data.geo.isp}]`);
                appendLog(outputBox, `\n[⚡] PORT EXPLOIT SURFACE SWEEP: Active Open Ports -> ${data.open_ports.join(', ') || 'None responsive'}`);
                appendLog(outputBox, `\n[☠] MISCONFIGURATION ARCHITECTURE FAULTS:`, data.vulnerabilities.length > 0 ? 'vuln-alert' : 'success-alert');
                data.vulnerabilities.forEach(v => appendLog(outputBox, `    x ${v}`, 'vuln-alert'));
            }

            generateGraphLayout(urlInput, data);

        } catch (error) {
            appendLog(outputBox, `[!] CORE COMMUNICATION EXCEPTION INCIDENT.`, 'vuln-alert');
        } finally {
            ticker.style.display = 'none';
        }
    }

            });

            edges.push({ from: 'root', to: 'ip', color: '#1e293b' });
            edges.push({ from: 'ip', to: 'geo', color: '#ffaa00' });

            data.open_ports.forEach(port => {
                const id = `port_${port}`;
                nodes.push({ id: id, label: `PORT ${port}`, color: '#7c2d12', shape: 'square' });
                edges.push({ from: 'ip', to: id, color: '#ff5500' });
            });

            });
        }
